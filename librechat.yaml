# LibreChat Configuration File
# For more information, see: https://www.librechat.ai/docs/configuration/librechat_yaml

version: 1.3.1

# Cache settings
cache: true

# Interface configuration
interface:
  fileCitations: true
  
  # MCP Servers configuration
  # Controls user permissions for MCP (Model Context Protocol) server management
  mcpServers:
    use: true      # Allow users to use configured MCP servers
    share: false    # Allow users to share MCP servers with other users
    create: true   # Allow users to create and manage new MCP servers
    public: false  # Allow users to share MCP servers publicly (with everyone)

endpoints:
  agents:
    capabilities:
      [
        'hide_sequential_outputs',
        'end_after_tools',
        'execute_code',
        'file_search',
        'web_search',
        'artifacts',
        'actions',
        'context',
        'tools',
        'chain',
        'ocr',
      ]
  # Route all LLM traffic through LiteLLM proxy for OTEL tracing
  # API keys are held by LiteLLM, not LibreChat
  custom:
    - name: "OpenAI"
      apiKey: "sk-litellm-proxy"
      baseURL: "http://litellm:4000/v1"
      models:
        default: ["gpt-5.6-sol", "gpt-5.6-terra", "gpt-5.6-luna"]
        fetch: false
      titleConvo: true
      titleModel: "gpt-5.6-luna"
      summarize: false
      forcePrompt: false
      modelDisplayLabel: "OpenAI"

    - name: "Anthropic"
      apiKey: "sk-litellm-proxy"
      baseURL: "http://litellm:4000/v1"
      models:
        default: ["claude-opus-5", "claude-sonnet-5", "claude-haiku-4-5"]
        fetch: false
      titleConvo: true
      titleModel: "claude-haiku-4-5"
      summarize: false
      forcePrompt: false
      modelDisplayLabel: "Anthropic"

    - name: "Google"
      apiKey: "sk-litellm-proxy"
      baseURL: "http://litellm:4000/v1"
      models:
        default: ["gemini-3.1-pro-preview", "gemini-3.7-flash", "gemini-3.5-flash-lite"]
        fetch: false
      titleConvo: true
      titleModel: "gemini-3.5-flash-lite"
      summarize: false
      forcePrompt: false
      modelDisplayLabel: "Google"


mcpSettings:
  allowedDomains:
    - "toolbox-mcp"
    # - "snowflake-mcp"

mcpServers:
  data-warehouse:
    type: streamable-http
    url: http://toolbox-mcp:5000/mcp
    timeout: 60000
  # snowflake:
  #   type: streamable-http
  #   url: http://snowflake-mcp:9000/mcp
  #   timeout: 60000
